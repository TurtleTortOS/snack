<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- SNACK logo: turtle shell, top view. Outer shell + center scute + 3 circuit pads (NPU cores). -->
  <!-- Uses currentColor so it follows the UI theme (dark/light). No tile, no stand — just the shell. -->
  <g fill="none" stroke="currentColor">
    <polygon points="32,5 55,18.5 55,45.5 32,59 9,45.5 9,18.5" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="32,21 43,27.5 43,36.5 32,43 21,36.5 21,27.5" stroke-width="3"/>
  </g>
  <g fill="currentColor">
    <circle cx="32" cy="13" r="3"/>
    <circle cx="49" cy="33" r="3"/>
    <circle cx="15" cy="33" r="3"/>
  </g>
</svg>
